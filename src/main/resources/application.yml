# Atlas v3.1 主配置
# 注意: api-key 禁止写入此文件！通过环境变量或启动参数注入

server:
  # port: 8500
  port: 8300

spring:
  application:
    name: kube-agent-atlas-v3

  # ============================================================
  # Spring AI — OpenAI兼容协议 (公司new-api代理)
  # ============================================================
  ai:
    model:
      chat: openai    # Spring AI 1.1.x 必须显式指定 ChatModel 供应商

    openai:
      base-url: "${SPRING_AI_OPENAI_BASE_URL:http://localhost:3000}"
      chat:
        options:
          model: "${SPRING_AI_OPENAI_CHAT_MODEL:moonshotai/kimi-k2.6}"
          temperature: 0.3  # Agent任务需要确定性，降低随机性
          max-tokens: 4096

# ============================================================
# Atlas v3.1 专用配置
# ============================================================
atlas:
  # --- 本地Embedding服务 ---
  embedding:
    enabled: true
    # 模型本地路径，首次启动自动下载
    model-path: "${user.home}/.atlas/models/all-MiniLM"
    # HuggingFace模型ID（用于下载）
    model-id: "sentence-transformers/all-MiniLM-L6-v2"
    # 向量维度 (all-MiniLM-L6-v2 = 384)
    dimension: 384
    # 语义匹配阈值 [0-1]，超过此值视为命中
    match-threshold: 0.75
    # 模型下载超时(秒) — 代理通时自动下载
    download-timeout-seconds: 60

  # --- 意图分级配置 ---
  intent:
    # L1: Embedding匹配阈值 (≥此值则跳过L2直接进入路由)
    l1-threshold: 0.85
    # L2: 规则精确匹配 (score == 100直接返回)
    l2-exact-match-score: 100
    # L3: LLM分类置信度阈值
    l3-confidence-threshold: 0.70
    # L4: 模糊兜底开关
    l4-fuzzy-fallback-enabled: true
    # 意图定义文件
    intents-config: "classpath:intents.yml"

  # --- 任务风险分级 (用于HITL) ---
  task-levels:
    # P0: 高危操作关键词
    p0-keywords: ["DELETE", "DROP", "REMOVE", "PURGE", "SCALE_DOWN", "TERMINATE"]
    # P1: 中危操作关键词
    p1-keywords: ["CREATE", "UPDATE", "PATCH", "SCALE_UP", "BIND"]
    # P2: 低危操作关键词
    p2-keywords: ["RESTART", "STOP", "PAUSE"]
    # P3: 纯查询 (免确认)
    p3-keywords: ["GET", "QUERY", "LIST", "DESCRIBE", "STATUS", "INFO"]

  # --- HITL人机回环 ---
  hitl:
    enabled: true
    # 确认超时时间(秒)
    confirmation-timeout-seconds: 60
    # 命令式确认模板
    command-confirm-template: "请输入'确认{action}{target}'以继续操作"

  # --- 6大Agent路由 ---
  audit:
    durable:
      enabled: ${ATLAS_AUDIT_DURABLE_ENABLED:false}
      fail-closed-for-high-risk: ${ATLAS_AUDIT_DURABLE_FAIL_CLOSED_FOR_HIGH_RISK:false}
      path: ${ATLAS_AUDIT_DURABLE_PATH:target/agent-audit/agent-audit.jsonl}
      retention-days: ${ATLAS_AUDIT_DURABLE_RETENTION_DAYS:30}
      max-file-bytes: ${ATLAS_AUDIT_DURABLE_MAX_FILE_BYTES:268435456}
      export-enabled: ${ATLAS_AUDIT_DURABLE_EXPORT_ENABLED:false}
      export-directory: ${ATLAS_AUDIT_DURABLE_EXPORT_DIRECTORY:target/agent-audit/export}
      export-format: ${ATLAS_AUDIT_DURABLE_EXPORT_FORMAT:jsonl-redacted}
      query-max-scan-records: ${ATLAS_AUDIT_DURABLE_QUERY_MAX_SCAN_RECORDS:10000}
      query-max-results: ${ATLAS_AUDIT_DURABLE_QUERY_MAX_RESULTS:500}
      audit-id-max-phase-records: ${ATLAS_AUDIT_DURABLE_AUDIT_ID_MAX_PHASE_RECORDS:20}

  agent-routing:
    default-agent: "query"
    # 意图前缀 → Agent映射
    mappings:
      "user_": "rbac"
      "role_": "rbac"
      "deploy_": "deploy"
      "pod_": "deploy"
      "service_": "deploy"
      "storage_": "storage"
      "pvc_": "storage"
      "network_": "network"
      "ingress_": "network"
      "diagnose_": "diag"
      "log_": "diag"
      "node_": "query"
      "cluster_": "query"
      "gpu_": "query"
      "image_": "query"

  # --- kube-manager连接配置 ---
  backend:
    # WSL Mirrored模式直连Windows主机
    base-url: "${ATLAS_BACKEND_BASE_URL:http://localhost:8100}"
    # 登录接口参数
    login-username: "${ATLAS_BACKEND_USERNAME:sysadmin}"
    login-password: "${ATLAS_BACKEND_PASSWORD:}"
    # 用户组织ID (用于/api/login精确匹配)
    organization-id: "${ATLAS_ORG_ID:}"
    # HTTP连接超时
    connect-timeout-seconds: 10
    # 读取超时
    read-timeout-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: ${ATLAS_ACTUATOR_HEALTH_DETAILS:when_authorized}
  metrics:
    tags:
      application: ${spring.application.name}

# --- 日志 ---
logging:
  level:
    com.atlas: ${ATLAS_LOG_LEVEL:INFO}
    org.springframework.ai: INFO

resilience4j:
  retry:
    instances:
      kubeManagerRead:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      kubeManagerWrite:
        max-attempts: 1
  circuitbreaker:
    instances:
      kubeManager:
        sliding-window-size: 50
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
  bulkhead:
    instances:
      kubeManager:
        max-concurrent-calls: 32
        max-wait-duration: 100ms
